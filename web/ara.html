<body><div class="wrap"><header class="site"><div class="meta"><a href="index.html">Tarih Ders Kitapları 1931</a> · <a href="ara.html">Arama</a> · <a href="duzeltilmis.html">Düzeltilmiş sayfalar</a> · <a href="inceleme.html">İnceleme</a> · <a href="hakkinda.html">Hakkında</a> · <a href="veri.html">Veri &amp; API</a></div></header><h1>Arama</h1><p class="meta">İki cildin tam metninde arama yapar. Türkçe aksan ve büyük/küçük harf duyarsızdır: <code>hurafe</code>, <code>İSLAM</code>, <code>taassup</code> aynı çalışır.</p><p><input id="q" placeholder="aranacak kelime…" style="width:100%;padding:.6rem .7rem;font-size:1rem;font-family:inherit;border:1px solid var(--bd);border-radius:4px;background:var(--card);color:var(--fg)"></p><p><select id="book" style="padding:.4rem;font-family:inherit;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:4px"><option value="">Her iki cilt</option><option value="tarih-1-1931">Tarih I</option><option value="tarih-2-1931">Tarih II</option></select> <span class="meta" id="status"></span></p><div id="out"></div><script>
const F={'â':'a','Â':'a','î':'i','Î':'i','û':'u','Û':'u','İ':'i','I':'i','ı':'i',
'Ü':'u','ü':'u','Ö':'o','ö':'o','Ç':'c','ç':'c','Ş':'s','ş':'s','Ğ':'g','ğ':'g'};
const fold=s=>s.replace(/[âÂîÎûÛİIıÜüÖöÇçŞşĞğ]/g,c=>F[c]).toLowerCase();
let IDX=null;
const el=id=>document.getElementById(id);
async function load(){if(IDX)return IDX;
  el('status').textContent='indeks yükleniyor…';
  IDX=await (await fetch('search-index.json')).json();
  IDX.forEach(r=>r._f=fold(r.t)); return IDX;}
async function run(){
  const q=el('q').value.trim(); if(!q){el('out').innerHTML='';el('status').textContent='';return;}
  const idx=await load(); const fq=fold(q);
  const book=el('book').value;
  const hits=idx.filter(r=>(!book||r.b===book)&&r._f.includes(fq)).slice(0,120);
  el('status').textContent=hits.length+' sonuç'+(hits.length>=120?' (ilk 120)':'');
  el('out').innerHTML=hits.map(r=>{
    const i=r._f.indexOf(fq); const s=Math.max(0,i-90);
    const raw=r.t.slice(s,i+160);
    const safe=raw.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    const lbl=r.p!=null?('s. '+r.p):'numarasız';
    const bk=r.b==='tarih-1-1931'?'Tarih I':'Tarih II';
    return `<div class="card" style="margin:.6rem 0"><a href="${r.u}"><b>${bk}, ${lbl}</b></a>`+
      (r.h?` <span class="meta">— ${r.h}</span>`:'')+
      `<div class="meta" style="margin-top:.35rem">…${safe}…</div></div>`;}).join('');
}
el('q').addEventListener('input',()=>{clearTimeout(window._t);window._t=setTimeout(run,220);});
el('book').addEventListener('change',run);
const p=new URLSearchParams(location.search).get('q');
if(p){el('q').value=p;run();}
</script><p class="sayac"><img class="sayac" src="https://hits.sh/tarih1931.github.io/ara.html.svg?style=flat-square&amp;label=ziyaret&amp;color=777&amp;labelColor=eee" alt="Bu sayfanın ziyaret sayısı" referrerpolicy="no-referrer"></p></div></body>
